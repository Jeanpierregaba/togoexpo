# À chaque push sur main : vérification du front, puis mise en ligne sur le serveur.
# Réglages du dépôt (Settings › Secrets and variables › Actions) :
#   variable DEPLOY_SERVER      deploy@IP
#   secret   DEPLOY_SSH_KEY     clé privée SSH dédiée au déploiement
#   secret   DEPLOY_KNOWN_HOSTS empreinte du serveur (ssh-keyscan IP)
name: Déploiement

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/**"
      - "wp/mu-plugins/**"
      - "wp/uploads.ini"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Un seul déploiement à la fois ; un nouveau push attend la fin du précédent.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Vérification (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    name: Mise en ligne
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Accès SSH au serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Envoi, build sur le serveur, redémarrage, rafraîchissement des pages.
      # Si le build échoue, le site en ligne reste sur la version précédente.
      - name: Déploiement
        env:
          SERVER: ${{ vars.DEPLOY_SERVER }}
        run: sh deploy/push.sh
