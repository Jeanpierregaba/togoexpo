services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-togoexpo}
      MYSQL_USER: ${MYSQL_USER:-togoexpo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-togoexpo_pwd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 30

  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-togoexpo}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-togoexpo_pwd}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-togoexpo}
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./acf-json:/var/www/html/wp-content/uploads/acf-json
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  wpcli:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-togoexpo}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-togoexpo_pwd}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-togoexpo}
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["wp", "--allow-root"]

volumes:
  db_data:
  wp_data:
