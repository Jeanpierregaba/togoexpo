# Production TogoExpo sur un VPS : un seul `docker compose up -d --build`.
#
#   Internet ──► caddy (80/443, HTTPS automatique)
#                 ├── SITE_DOMAIN      ──► front     (Next.js, port 3000)
#                 ├── www.SITE_DOMAIN  ──► redirection vers SITE_DOMAIN
#                 └── CMS_DOMAIN       ──► wordpress (Apache + PHP, port 80) ──► db (MySQL)
#
# Seul Caddy publie des ports. Le front lit WordPress par le réseau interne,
# WordPress prévient le front par le réseau interne à chaque publication.
# Réglages : deploy/.env (modèle : deploy/.env.example).

name: togoexpo-prod

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
  WORDPRESS_DB_USER: ${MYSQL_USER}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
  # Ajouté à wp-config.php (et relu par WP-CLI).
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_HOME', 'https://${CMS_DOMAIN}');
    define('WP_SITEURL', 'https://${CMS_DOMAIN}');
    define('TOGOEXPO_FRONT_URL', 'http://front:3000');
    define('TOGOEXPO_REVALIDATE_SECRET', '${REVALIDATE_SECRET}');
    define('DISALLOW_FILE_EDIT', true);
    define('WP_POST_REVISIONS', 20);
    define('WP_ENVIRONMENT_TYPE', 'production');

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Dans le réseau interne, les deux domaines mènent à Caddy : le front
        # charge les images du CMS sans ressortir sur Internet.
        aliases:
          - ${SITE_DOMAIN}
          - ${CMS_DOMAIN}
    depends_on:
      - front
      - wordpress

  front:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_WP_URL: https://${CMS_DOMAIN}
        NEXT_PUBLIC_WP_GRAPHQL_URL: https://${CMS_DOMAIN}/graphql
    image: togoexpo-front
    restart: unless-stopped
    environment:
      WP_GRAPHQL_INTERNAL_URL: http://wordpress/graphql
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    volumes:
      # Cache ISR et images optimisées : conservés d'un redémarrage à l'autre.
      - next_cache:/app/.next/cache
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:6.9-php8.3-apache
    restart: unless-stopped
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ../wp/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ../wp/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Outil ponctuel : `docker compose run --rm wpcli <commande>`.
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ../wp/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ../wp:/setup:ro
      - ./import:/import:ro
    working_dir: /var/www/html
    entrypoint: ["wp"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  next_cache:
  wp_data:
  db_data:
